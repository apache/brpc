syntax = "proto2";

package brpc.urma;

option java_package = "com.brpc.urma";
option java_outer_classname = "UrmaHandshakeProto";

// Wire-level handshake message exchanged between two UrmaTransport peers
// after the TCP connection is established. The first 4 bytes on the wire
// are the magic "URM3" (v3) followed by a 4-byte big-endian length prefix
// and then the protobuf-encoded UrmaHello.
message UrmaHello {
    required uint32 buffer_size = 1;      // recv buffer size in bytes (per WR)
    required uint32 recv_buffer_cnt = 2;  // number of recv buffers posted
    required uint32 jetty_id = 3;         // local jetty id
    required bytes eid = 4;               // 16-byte local EID (network order)
    required uint32 uasid = 5;            // local uasid
    required uint32 tp_type = 6;          // urma_tp_type_t

    // Flattened peer buffer-pool segment (urma_seg_t + token). The receiver
    // calls urma_import_seg with these fields BEFORE urma_import_jetty, so
    // the kernel establishes the transport path (TP) routing for the remote
    // EID. Otherwise the first SEND is rejected by hardware with
    // URMA_CR_RNR_RETRY_CNT_EXC_ERR (status=10).
    required bytes seg_eid = 7;           // 16-byte EID owning the segment
    required uint32 seg_uasid = 8;       // uasid owning the segment
    required uint64 seg_va = 9;          // segment virtual address
    required uint64 seg_len = 10;        // segment length in bytes
    required uint32 seg_token_id = 11;   // segment token id
}
