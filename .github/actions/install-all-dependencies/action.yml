runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/install-essential-dependencies
      with:
        extra-packages: >-
          ccache libunwind-dev libgoogle-glog-dev automake bison flex
          libboost-all-dev libevent-dev libtool pkg-config
    - name: Install Apache Thrift 0.11.0
      run: |
        set -euo pipefail
        readonly thrift_archive=thrift-0.11.0.tar.gz
        readonly thrift_sha256=c4ad38b6cb4a3498310d405a91fef37b9a8e79a50cd0968148ee2524d2fa60c2
        readonly thrift_urls=(
          https://archive.apache.org/dist/thrift/0.11.0/${thrift_archive}
          https://mirrors.huaweicloud.com/apache/thrift/0.11.0/${thrift_archive}
        )
        for thrift_url in "${thrift_urls[@]}"; do
          if curl --fail --location --retry 1 --retry-delay 2 \
              --connect-timeout 15 --max-time 45 \
              --output "${thrift_archive}" "${thrift_url}"; then
            break
          fi
          rm -f "${thrift_archive}"
        done
        test -s "${thrift_archive}"
        printf '%s  %s\n' "${thrift_sha256}" "${thrift_archive}" | sha256sum --check -
        tar -xzf "${thrift_archive}"
        cd thrift-0.11.0
        ./configure --prefix=/usr --disable-tests --with-rs=no --with-ruby=no --with-python=no --with-java=no --with-go=no --with-perl=no --with-php=no --with-csharp=no --with-erlang=no --with-lua=no --with-nodejs=no --with-haskell=no --with-dotnetcore=no CXXFLAGS="-Wno-unused-variable"
        make -j ${{env.proc_num}} && sudo make install
      shell: bash
    - run: |
        git clone https://github.com/abseil/abseil-cpp.git && cd abseil-cpp && git checkout lts_2022_06_23
        cmake -DBUILD_TESTING=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_POLICY_VERSION_MINIMUM=3.5 .
        make -j ${{env.proc_num}} && sudo make install
      shell: bash
